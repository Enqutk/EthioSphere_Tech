# Programmers World — Traefik with Let's Encrypt HTTPS
# Needs AWS security group: TCP 80 + TCP 443 open for pw.aklildr.com
services:
  traefik:
    image: traefik:v3.3
    container_name: programmers-world-traefik
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
      - letsencrypt:/letsencrypt
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  letsencrypt:
